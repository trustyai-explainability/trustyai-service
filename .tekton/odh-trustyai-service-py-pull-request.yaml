apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/trustyai-service?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: "^/build-konflux"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && (files.all.exists(p, ! p.matches('^\\.tekton/')) || ".tekton/odh-trustyai-service-py-pull-request.yaml".pathChanged())
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: rhoai-v3-6
    appstudio.openshift.io/component: odh-trustyai-service-py-v3-6
    pipelines.appstudio.openshift.io/type: build
  name: odh-trustyai-service-py-on-pull-request-{{pull_request_number}}
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-trustyai-service-py-rhel9:on-pr-{{pull_request_number}}
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-trustyai-service-py
  - name: image-expires-after
    value: 30d
  - name: dockerfile
    value: Dockerfile.konflux
  - name: build-args-file
    value: .konflux/base-images.conf
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: prefetch-input
    value: '[{"type": "pip", "path": ".", "requirements_files": [".konflux/requirements.txt"], "requirements_build_files": [".konflux/requirements-build.txt"], "binary": {"arch": "x86_64,aarch64,ppc64le,s390x"}}]'
  - name: hermetic
    value: "true"
  - name: build-image-index
    value: true
  - name: enable-slack-failure-notification
    value: "false"
  - name: path-context
    value: .
  - name: rhoai-version
    value: "3.6.0"
  - name: build-source-image
    value: true
  timeouts:
    pipeline: 4h
    tasks: 2h
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunSpecs:
  - pipelineTaskName: rpms-signature-scan
    computeResources:
      requests:
        cpu: 2600m
        memory: 512Mi
      limits:
        cpu: 2600m
        memory: 512Mi
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-trustyai-service-py-v3-6
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
