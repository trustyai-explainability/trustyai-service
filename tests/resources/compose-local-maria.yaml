### Use this to run the mariadb tests locally: `podman compose -f compose-local-maria.yaml up
### Storage-migration live-DB tests also need PostgreSQL:
### `podman compose -f compose-local-maria.yaml --profile migrations up`

x-common-variables: &global-variables
  MARIADB_ROOT_PASSWORD: root  # pragma: allowlist secret
  MARIADB_USER: trustyai
  MARIADB_PASSWORD: trustyai  # pragma: allowlist secret
  MARIADB_DATABASE: trustyai-database

services:
  trustyai-pg-container:
    profiles: ["migrations"]
    networks:
      - data-connection
    container_name: trustyai-pg-container
    healthcheck:
      interval: 10s
      retries: 3
      test:
        ["CMD-SHELL", "pg_isready -U trustyai -d trustyai-database"]
      timeout: 5s
    ports:
      - 5432:5432
    expose:
      - 5432
    environment:
      POSTGRES_USER: trustyai
      POSTGRES_PASSWORD: trustyai  # pragma: allowlist secret
      POSTGRES_DB: trustyai-database
    image: postgres:16
  trustyai-db-container:
    networks:
      - data-connection
    container_name: trustyai-db-container
    healthcheck:
      interval: 30s
      retries: 3
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized"
        ]
      timeout: 30s
    ports:
      - 3306:3306
    expose:
      - 3306
    volumes:
      - trustyai-db-container:/var/lib/mysql/
      - ./legacy_database_dump.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      <<: *global-variables
    image: mariadb
volumes:
  trustyai-db-container:
networks:
  data-connection:
