          maximum: 0.5
          title: Epsilon
          type: number
        fitColumns:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Fitcolumns
        metricName:
          default: KSTESTSTREAMING
          title: Metricname
          type: string
        modelId:
          title: Modelid
          type: string
        referenceTag:
          anyOf:
          - type: string
          - type: 'null'
          title: Referencetag
        requestName:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestname
        thresholdDelta:
          default: 0.05
          title: Thresholddelta
          type: number
