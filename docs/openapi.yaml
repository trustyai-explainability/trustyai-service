info:
  description: TrustyAI Service API
  title: TrustyAI Service API
  version: 1.0.0rc0
openapi: 3.1.0
paths:
  /:
    get:
      description: 'Root endpoint returning service welcome message.


        :return: Dictionary with welcome message'
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Root  Get
                type: object
          description: Successful Response
      summary: Root
    post:
      description: 'Consume KServe v2 payloads from cloud events.


        Handles both the KServe inference logger CloudEvent format (with ``ce-type``

        and ``Inferenceservicename`` headers) and plain KServe v2 JSON.


        Knative Eventing may strip the Content-Encoding header while leaving the

        body gzip-compressed, so this endpoint detects gzip by magic bytes and

        decompresses before JSON parsing.


        :param http_request: Raw HTTP request (body may be gzip-compressed without header)

        :param ce_id: Cloud event ID from header (correlation ID)

        :param ce_type: Cloud event type — determines request vs response

        :param inferenceservicename: Model name from KServe inference logger

        :param tag: Optional tag to associate with the data

        :raises HTTPException: If payload processing fails'
      operationId: consume_cloud_event__post
      parameters:
      - in: query
        name: tag
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
      - in: header
        name: ce-id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ce-Id
      - in: header
        name: ce-type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ce-Type
      - in: header
        name: inferenceservicename
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Inferenceservicename
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Consume Cloud Event  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Consume Cloud Event
      tags:
      - '{Internal Only} Inference Consumer'
      - '{Internal Only} ModelMesh Consumer'
  /consumer/kserve/v2:
    post:
      description: "Process a KServe v2 payload.\n\nThis endpoint accepts both input (request) and output\
        \ (response) payloads from ModelMesh-served models\nand stores them for reconciliation. When both\
        \ input and output payloads for the same ID are available,\nthey are reconciled and stored as\
        \ data.\n\nArgs:\n    payload: The KServe v2 payload containing either request or response data\n\
        \nReturns:\n    A JSON response indicating success or failure"
      operationId: consume_inference_payload_consumer_kserve_v2_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferencePartialPayload'
        required: true
      responses:
        '200':
          content:
