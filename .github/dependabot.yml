version: 2
updates:
  # `uv` updates pyproject.toml and uv.lock together. The `pip` ecosystem only
  # edited pyproject.toml, leaving uv.lock stale and breaking `uv sync --locked`.
  # requirements.txt stays generated: regenerate it after lock changes with
  #   uv export --frozen --format requirements.txt \
  #     --extra mariadb --extra postgres --extra migration --extra mmd \
  #     --no-dev --no-emit-project --emit-index-url --output-file requirements.txt
  # (same command as the `requirements` job in python-tests.yaml).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - trustyai-explainability/reviewers
    reviewers:
      - trustyai-explainability/reviewers

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - trustyai-explainability/reviewers
    reviewers:
      - trustyai-explainability/reviewers
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - trustyai-explainability/reviewers
    reviewers:
      - trustyai-explainability/reviewers
