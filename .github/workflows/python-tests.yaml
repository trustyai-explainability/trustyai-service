name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        run: uv sync --group dev --group types --group test

      - name: Generate protobuf stubs
        run: bash scripts/generate_protos.sh

      - name: Type check with pyrefly
        run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    # Live-DB gate: run the SQL storage and migration integration suites against
    # real PostgreSQL and MariaDB servers. SQLite runs in-process.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustyai
          POSTGRES_PASSWORD: trustyai  # pragma: allowlist secret
          POSTGRES_DB: trustyai-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustyai -d trustyai-database"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true  # Python 3.14 is pre-release until Oct 2026

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb3 libmariadb-dev mariadb-client protobuf-compiler

      - name: Install Python dependencies
        run: uv sync --all-groups --extra mariadb --extra postgres --extra sqlite --extra migration --extra mmd

      - name: Generate protobuf stubs
        run: bash scripts/generate_protos.sh

      - name: Shutdown Ubuntu MySQL
        run: |
          sudo service mysql stop || true
          sudo service mariadb stop || true

      - name: Set up MariaDB
        uses: getong/mariadb-action@d6d2ec41fd5588f369be4c9398ce77ee725ca9ea # v1.11
        with:
          mysql user: 'trustyai'
          mysql password: 'trustyai'  # pragma: allowlist secret
          mysql root password: ''
          mysql database: 'trustyai-database'

      - name: Populate Database
        run: mariadb -u trustyai --password=trustyai -D trustyai-database -h 127.0.0.1 < tests/resources/legacy_database_dump.sql  # pragma: allowlist secret

      - name: Run non-migration tests with pytest
        env:
          # Missing drivers/servers must fail the live SQL and migration gates.
          TRUSTYAI_REQUIRE_LIVE_SQL_TESTS: "1"
          TRUSTYAI_MIGRATION_TEST_MARIADB_URL: mysql+asyncmy://trustyai:trustyai@127.0.0.1:3306/trustyai-database  # pragma: allowlist secret
          TRUSTYAI_MIGRATION_TEST_POSTGRES_URL: postgresql+asyncpg://trustyai:trustyai@127.0.0.1:5432/trustyai-database  # pragma: allowlist secret
        run: uv run pytest tests/ -v --ignore=tests/service/data/migrations --cov=src --cov-report=

      - name: Run storage migration tests serially
        env:
          TRUSTYAI_REQUIRE_LIVE_SQL_TESTS: "1"
          TRUSTYAI_MIGRATION_TEST_MARIADB_URL: mysql+asyncmy://trustyai:trustyai@127.0.0.1:3306/trustyai-database  # pragma: allowlist secret
          TRUSTYAI_MIGRATION_TEST_POSTGRES_URL: postgresql+asyncpg://trustyai:trustyai@127.0.0.1:5432/trustyai-database  # pragma: allowlist secret
        run: uv run pytest tests/service/data/migrations -v -n 0 --cov=src --cov-append --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
